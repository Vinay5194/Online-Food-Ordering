
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Food Ordering</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #fff4e6;
            margin: 0;
        }
        header {
            background: #e63946;
            color: white;
            padding: 25px;
        }
        .food {
            display: inline-block;
            background: white;
            padding: 20px;
            margin: 15px;
            border-radius: 12px;
        }
        button {
            background: #e63946;
            color: white;
            padding: 10px 18px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <h1>Online Food Ordering</h1>
        <p>Delicious food delivered to your door!</p>
    </header>

    <div class="food">
        <h2>🍕 Pizza</h2>
        <p>₹199</p>
        <button onclick="order('Pizza')">Order Now</button>
    </div>

    <div class="food">
        <h2>🍔 Burger</h2>
        <p>₹99</p>
        <button onclick="order('Burger')">Order Now</button>
    </div>

    <div class="food">
        <h2>🍜 Noodles</h2>
        <p>₹149</p>
        <button onclick="order('Noodles')">Order Now</button>
    </div>

    <script>
        function order(food) {
            alert("You selected " + food + "!");
        }
    </script>
</body>
</html>
